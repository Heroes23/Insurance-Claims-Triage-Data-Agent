insurance_dbt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{env_var('SNOWFLAKE_ACCOUNT')}}"
      user: "{{env_var('SNOWFLAKE_USER')}}"
      password: "{{env_var('SNOWFLAKE_PASSWORD')}}"
      role: TRANSFORMER
      warehouse: DE_WH
      database: INSURANCE_DB
      schema: ANALYTICS
      threads: 4